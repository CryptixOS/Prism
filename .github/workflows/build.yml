name: CI
permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: [ "master" ]

jobs:
  cmake:
    name: CMake (${{ matrix.target }}, ${{ matrix.compiler }}, ${{ matrix.build-type }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        # app uses the system fmt, cryptix-app the bundled, patched fmt 10.2.
        target: [app, cryptix-app]
        compiler: [gcc, clang]
        build-type: [Debug, Release]

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja fmt clang patch

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DPRISM_TARGET=${{ matrix.target }} \
            -DPRISM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: DESTDIR="$PWD/staging" cmake --install build

  # Deprecated meson build, kept while it's still supported.
  meson:
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [debugoptimized, debug, release]
        architecture: [x86_64, aarch64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: sudo apt update -y && sudo apt install -y meson ninja-build clang lld llvm git cmake python3 pipx fasm
          && sudo apt install build-essential qemu-system parted udev bison flex libgmp3-dev libmpc-dev libmpfr-dev
          && sudo apt install texinfo libisl-dev gperf gettext autopoint libreadline-dev help2man groff zsh xorriso g++-aarch64-linux-gnu libgcc-14-dev-arm64-cross libstdc++-14-dev-arm64-cross g++-x86-64-linux-gnu libgcc-14-dev-amd64-cross libstdc++-14-dev-amd64-cross
          && pipx install xbstrap 
      - name: Configure Project
        run: meson setup build --buildtype=${{ matrix.build-configuration }} --cross-file="CrossFiles/kernel-target-gcc-${{ matrix.architecture }}.cross-file"
          && (cd subprojects/fmt-10.2.0/ && patch -p 1 < ../../fmt-10.2.0.patch)
          && ninja -C build -j5
      - name: Build Tests
        run: ninja -C build test
    
