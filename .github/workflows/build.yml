name: CI
permissions:
  contents: read

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.arch }} / ${{ matrix.target }} / ${{ matrix.compiler }} / ${{ matrix.build }}
    # Native runners for both architectures. Arch Linux has no official
    # aarch64 image, so aarch64 builds in Fedora.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.arch == 'aarch64' && 'fedora:latest' || 'archlinux:base-devel' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # cryptix and carbonc are freestanding: library only, no tests.
        target: [app, cryptix-app, cryptix, carbonc]
        compiler: [gcc, clang]
        # Same names as CryptixOS (Meta/setup.sh): release keeps debug info,
        # dist is the fully optimized build.
        build: [debug, release, dist, minsize]
        include:
          - build: debug
            cmake-build-type: Debug
          - build: release
            cmake-build-type: RelWithDebInfo
          - build: dist
            cmake-build-type: Release
          - build: minsize
            cmake-build-type: MinSizeRel

    steps:
      - name: Install dependencies
        run: |
          if [ -f /etc/arch-release ]; then
            pacman -Syu --noconfirm --needed git cmake ninja clang
          else
            dnf install -y git cmake ninja-build gcc gcc-c++ libstdc++-devel \
              libstdc++-static clang clang-tools-extra
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
          fi
          ${CXX:-c++} --version
          hosted=OFF
          case "${{ matrix.target }}" in app|cryptix-app) hosted=ON ;; esac
          # The freestanding targets build Prism's own sources with
          # -nostdinc++, so no hosted C++ header can sneak in. Outside the
          # kernel tree, cryptix gets stand-ins for the few CryptixOS
          # headers it includes.
          extra=
          if [ $hosted = OFF ]; then
            extra="-DPRISM_STRICT_FREESTANDING=ON"
          fi
          if [ "${{ matrix.target }}" = cryptix ]; then
            extra="$extra -DPRISM_EXTRA_INCS=$PWD/Meta/ci/cryptix-include"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DPRISM_TARGET=${{ matrix.target }} \
            -DPRISM_BUILD_TESTS=$hosted \
            -DPRISM_BUILD_BENCHMARKS=$hosted $extra

      - name: Build
        run: cmake --build build

      - name: Test
        if: matrix.target == 'app' || matrix.target == 'cryptix-app'
        run: ctest --test-dir build --output-on-failure

      - name: Check the platform hook contract
        if: matrix.target == 'cryptix' || matrix.target == 'carbonc'
        run: Meta/ci/check-hooks.sh build/libprism.a ${{ matrix.target }}

      - name: Install
        run: DESTDIR="$PWD/staging" cmake --install build

  # Hardened (PRISM_HARDENED) build of the tests, under ASan and UBSan.
  sanitize:
    name: sanitize / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja clang compiler-rt

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPRISM_TARGET=app \
            -DPRISM_BUILD_TESTS=ON \
            -DPRISM_HARDENED=ON \
            -DPRISM_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # A short libFuzzer run of every Fuzz/ target.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja clang compiler-rt

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPRISM_TARGET=app \
            -DPRISM_HARDENED=ON \
            -DPRISM_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build

      - name: Fuzz
        run: |
          for target in Format Path OptionParser Number String; do
            mkdir -p "corpus/$target"
            echo "== $target"
            build/Fuzz/$target -max_total_time=60 -timeout=10 \
              -rss_limit_mb=2048 "corpus/$target"
          done

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
