name: CI
permissions:
  contents: read

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.arch }} / ${{ matrix.target }} / ${{ matrix.compiler }} / ${{ matrix.build }}
    # Native runners for both architectures. Arch Linux has no official
    # aarch64 image, so aarch64 builds in Fedora.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.arch == 'aarch64' && 'fedora:latest' || 'archlinux:base-devel' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # app uses the system fmt, cryptix-app the bundled, patched fmt 10.2.
        # cryptix and carbonc are freestanding: library only, no tests.
        target: [app, cryptix-app, cryptix, carbonc]
        compiler: [gcc, clang]
        # Same names as CryptixOS (Meta/setup.sh): release keeps debug info,
        # dist is the fully optimized build.
        build: [debug, release, dist, minsize]
        include:
          - build: debug
            cmake-build-type: Debug
          - build: release
            cmake-build-type: RelWithDebInfo
          - build: dist
            cmake-build-type: Release
          - build: minsize
            cmake-build-type: MinSizeRel

    steps:
      - name: Install dependencies
        run: |
          if [ -f /etc/arch-release ]; then
            pacman -Syu --noconfirm --needed git cmake ninja fmt clang patch
          else
            dnf install -y git cmake ninja-build gcc gcc-c++ libstdc++-devel \
              libstdc++-static clang clang-tools-extra fmt-devel patch
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
          fi
          ${CXX:-c++} --version
          hosted=OFF
          case "${{ matrix.target }}" in app|cryptix-app) hosted=ON ;; esac
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DPRISM_TARGET=${{ matrix.target }} \
            -DPRISM_BUILD_TESTS=$hosted \
            -DPRISM_BUILD_BENCHMARKS=$hosted

      - name: Build
        run: cmake --build build

      - name: Test
        if: matrix.target == 'app' || matrix.target == 'cryptix-app'
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: DESTDIR="$PWD/staging" cmake --install build
